# Packages installed by run_onchange_before_10-install-packages.sh.tmpl.
# Edit and run `chezmoi apply`: the script re-runs whenever this list changes.
#
# common  - same name in every package manager
# <mgr>   - extras / distro-specific names for that package manager
# work    - also installed on work machines (chezmoi's `work` is true); same name everywhere
#
# neovim isn't in the apt list: Debian 12 / Ubuntu 24.04 ship one too old for
# LazyVim, so .chezmoiexternal.toml.tmpl installs the upstream release there.
# ripgrep, fd and a C compiler are what LazyVim needs besides git, fzf and curl.
# bat is installed as `batcat` on Debian/Ubuntu; ~/.config/zsh handles both names.
# command-not-found / pkgfile / PackageKit-command-not-found back the oh-my-zsh
# command-not-found plugin (Homebrew has its handler built in).

[packages]
common = ["zsh", "git", "curl", "jq", "git-delta", "eza", "fzf", "zoxide", "ripgrep", "bat"]
apt    = ["fonts-powerline", "fd-find", "build-essential", "command-not-found"]
pacman = ["powerline-fonts", "neovim", "fd", "gcc", "pkgfile"]
dnf    = ["powerline-fonts", "util-linux-user", "neovim", "fd-find", "gcc", "PackageKit-command-not-found"]
brew   = ["neovim", "fd"]
work   = ["glab"]
